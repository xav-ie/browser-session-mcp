name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Decide which parts this change touches, so a docs-only push skips them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      nix: ${{ steps.filter.outputs.nix }}
      screenshot: ${{ steps.filter.outputs.screenshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            nix:
              - 'src/**'
              - 'frontend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '*.nix'
              - 'flake.lock'
              - 'scripts/smoke.sh'
              - 'scripts/screenshot*'
              - 'tests/**'
              - 'packaging/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            screenshot:
              - 'frontend/**'
              - 'scripts/screenshot*'
              - '.github/workflows/ci.yml'

  # The Jev scenarios replay answers recorded with a key; when what shapes
  # their questions changed, fail here, before any build, so they get
  # recorded again (see tests/scenarios/jev-answers.mjs).
  jev-answers:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node tests/scenarios/jev-answers.mjs --check

  # Frontend quality gates, one job per check so failures stay isolated.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: [astro, lint, format]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:${{ matrix.check }}

  # Rust build (all binaries) + clippy + the frontend build + treefmt, reproducibly via
  # Nix. Deliberately builds the individual checks rather than `nix flake
  # check`, so the KVM-only VM test (checks.smoke) stays in its own job below
  # instead of failing here for lack of /dev/kvm.
  build-linux:
    name: build (x86-64 linux)
    needs: [changes, jev-answers]
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.head_ref == 'release' && 60 || 30 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-cache
        with:
          push-token: ${{ secrets.ATTIC_TOKEN }}
      # Everything builds the fast `ci` profile. Only the release PR also builds
      # the optimized package and the static musl release, so a broken release
      # build shows up before the tag; release.yml builds those again itself.
      - env:
          FULL: ${{ github.head_ref == 'release' }}
        run: |
          targets=(
            ".#packages.x86_64-linux.browser-session-mcp-ci"
            ".#checks.x86_64-linux.clippy"
            ".#checks.x86_64-linux.test"
            ".#checks.x86_64-linux.deps"
            ".#checks.x86_64-linux.treefmt"
            ".#packages.x86_64-linux.systemd-units"
          )
          if [[ $FULL == true ]]; then
            targets+=(".#checks.x86_64-linux.build" ".#packages.x86_64-linux.release")
          fi
          nix build -L "${targets[@]}"
      # Hand nixos-test the package it boots (71 MiB with its runtime closure),
      # so it doesn't compile it again. Pull requests never push to the binary
      # cache, so this is the only way it reaches that job there.
      - name: Export the package for nixos-test
        run: |
          nix path-info .#packages.x86_64-linux.browser-session-mcp-ci > paths.txt
          nix copy --to "file://$RUNNER_TEMP/ci-package?compression=zstd" --stdin <paths.txt
          mv paths.txt "$RUNNER_TEMP/ci-package/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-package
          path: ${{ runner.temp }}/ci-package
          retention-days: 1
          if-no-files-found: error

  # NixOS VM integration test (checks.smoke): boots a VM running the real
  # nixos-module.nix stack and drives the full MCP surface. VM tests need
  # /dev/kvm, which GitHub's Linux runners expose but don't grant the runner
  # user access to by default; the udev rule below fixes that.
  nixos-test:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/nix-cache
        with:
          push-token: ${{ secrets.ATTIC_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-package
          path: ${{ runner.temp }}/ci-package
      # As root, since only a trusted user may import unsigned paths.
      - name: Import the package from build-linux
        run: xargs sudo "$(command -v nix)" copy --no-check-sigs --from "file://$RUNNER_TEMP/ci-package" <"$RUNNER_TEMP/ci-package/paths.txt"
      - run: nix build -L ".#checks.x86_64-linux.smoke"

  # CI is the one renderer of the README's takeover screenshot, so the image never depends on
  # whose Chrome took it. When the takeover UI changes, this retakes it from the package
  # build-linux made; a picture that changed is committed to the PR branch over a write deploy
  # key, since a push made with GITHUB_TOKEN would not start CI on the new commit. CI then runs
  # on that commit and renders the same picture. A Dependabot PR reads its key from the
  # Dependabot secrets, where only DEPENDABOT_PUSH_KEY is set.
  screenshot:
    needs: [changes, build-linux]
    if: github.event_name == 'pull_request' && needs.changes.outputs.screenshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/nix-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-package
          path: ${{ runner.temp }}/ci-package
      # As root, since only a trusted user may import unsigned paths.
      - name: Import the package from build-linux
        run: |
          xargs sudo "$(command -v nix)" copy --no-check-sigs --from "file://$RUNNER_TEMP/ci-package" <"$RUNNER_TEMP/ci-package/paths.txt"
          ln -s "$(head -1 "$RUNNER_TEMP/ci-package/paths.txt")" result
      # The flake's own Chromium, so a new runner image doesn't redraw the picture. Ubuntu
      # denies Chrome's sandbox the user namespaces it needs, hence --no-sandbox.
      - name: Retake the screenshot
        run: |
          chromium=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#chromium)
          printf '#!/usr/bin/env bash\nexec %s/bin/chromium --no-sandbox "$@"\n' "$chromium" >"$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          CHROME="$RUNNER_TEMP/chrome" node scripts/screenshot.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takeover-screenshot
          path: docs/images/takeover.png
          retention-days: 7
      - name: Commit it when it changed
        env:
          DEPLOY_KEY: ${{ secrets.SCREENSHOT_PUSH_KEY || secrets.DEPENDABOT_PUSH_KEY }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- docs/images/takeover.png; then echo "The screenshot is current."; exit 0; fi
          msg="docs: retake the takeover screenshot"
          if [ "$(git log -1 --format=%s)" = "$msg" ]; then
            echo "::error::the screenshot changed again right after CI retook it, so its render isn't stable; see the takeover-screenshot artifact"
            exit 1
          fi
          [ -n "$DEPLOY_KEY" ] || { echo "::error::the takeover UI changed the screenshot, but this PR can't read SCREENSHOT_PUSH_KEY to commit it; commit the takeover-screenshot artifact as docs/images/takeover.png"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "$msg" -- docs/images/takeover.png
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          echo "::notice::committed the retaken screenshot; CI runs again on it"

  # Builds the aarch64-darwin package via Nix on an arm64 macOS runner, so the
  # Darwin build path the flake exposes is actually exercised; the release PR
  # also builds the release binary and its check that it links nothing from
  # /nix/store. macos-latest is arm64, matching aarch64-darwin.
  build-darwin:
    name: build (aarch64-darwin)
    needs: [changes, jev-answers]
    if: needs.changes.outputs.nix == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-cache
        with:
          push-token: ${{ secrets.ATTIC_TOKEN }}
      # As on Linux: the `ci` profile, plus the shipped builds on the release PR.
      - env:
          FULL: ${{ github.head_ref == 'release' }}
        run: |
          targets=(".#packages.aarch64-darwin.browser-session-mcp-ci")
          if [[ $FULL == true ]]; then
            targets+=(".#packages.aarch64-darwin.default" ".#packages.aarch64-darwin.release")
          fi
          nix build -L "${targets[@]}"

  # The check main's ruleset requires: it passes when every job above passed or
  # was skipped as unrelated to the change, so a docs-only PR isn't left waiting
  # on builds that never ran.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, jev-answers, frontend, build-linux, nixos-test, screenshot, build-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) echo "::error::a CI job ended with $r"; exit 1 ;; esac
          done
