name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Decide which parts this change touches, so a docs-only push skips them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            nix:
              - 'src/**'
              - 'frontend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '*.nix'
              - 'flake.lock'
              - 'scripts/smoke.sh'
              - 'packaging/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  # Frontend quality gates, one job per check so failures stay isolated.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: [astro, lint, format]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:${{ matrix.check }}

  # Rust build (all binaries) + clippy + the frontend build + treefmt, reproducibly via
  # Nix. Deliberately builds the individual checks rather than `nix flake
  # check`, so the KVM-only VM test (checks.smoke) stays in its own job below
  # instead of failing here for lack of /dev/kvm.
  build-linux:
    name: build (x86-64 linux)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-cache
        with:
          push-token: ${{ secrets.ATTIC_TOKEN }}
      - run: |
          nix build -L \
            ".#checks.x86_64-linux.build" \
            ".#checks.x86_64-linux.clippy" \
            ".#checks.x86_64-linux.treefmt" \
            ".#packages.x86_64-linux.systemd-units" \
            ".#packages.x86_64-linux.release"

  # NixOS VM integration test (checks.smoke): boots a VM running the real
  # nixos-module.nix stack and drives the full MCP surface. VM tests need
  # /dev/kvm, which GitHub's Linux runners expose but don't grant the runner
  # user access to by default; the udev rule below fixes that.
  nixos-test:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/nix-cache
        with:
          push-token: ${{ secrets.ATTIC_TOKEN }}
      - run: nix build -L ".#checks.x86_64-linux.smoke"

  # Builds the aarch64-darwin package and release binary via Nix on an arm64
  # macOS runner, so the Darwin build path the flake exposes is actually
  # exercised, and the release build's check that it links nothing from
  # /nix/store runs on every change. macos-latest is arm64, matching
  # aarch64-darwin.
  build-darwin:
    name: build (aarch64-darwin)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-cache
        with:
          push-token: ${{ secrets.ATTIC_TOKEN }}
      - run: |
          nix build -L \
            ".#packages.aarch64-darwin.default" \
            ".#packages.aarch64-darwin.release"

  # The check main's ruleset requires: it passes when every job above passed or
  # was skipped as unrelated to the change, so a docs-only PR isn't left waiting
  # on builds that never ran.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, frontend, build-linux, nixos-test, build-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) echo "::error::a CI job ended with $r"; exit 1 ;; esac
          done
