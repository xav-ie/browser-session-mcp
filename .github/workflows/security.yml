name: Security

# CodeQL code scanning and dependency review.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, for newly published queries and advisories

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # The CodeQL languages to analyze: on a pull request only those it touches (or all, when it
  # changes this workflow); on main and the weekly run, all of them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.diff.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all='["actions","javascript-typescript","rust"]'
          if [ "$EVENT" != pull_request ]; then
            echo "languages=$all" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          if echo "$changed" | grep -qx '.github/workflows/security.yml'; then
            echo "languages=$all" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          langs=()
          echo "$changed" | grep -q '^\.github/\(workflows\|actions\)/' && langs+=('"actions"')
          echo "$changed" | grep -qE '\.(js|mjs|cjs|ts|mts|cts|tsx|jsx|astro|html)$' && langs+=('"javascript-typescript"')
          echo "$changed" | grep -qE '(\.rs|(^|/)Cargo\.(toml|lock))$' && langs+=('"rust"')
          echo "languages=[$(IFS=,; echo "${langs[*]}")]" >>"$GITHUB_OUTPUT"

  codeql:
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Flags pull requests that add dependencies with known vulnerabilities.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
