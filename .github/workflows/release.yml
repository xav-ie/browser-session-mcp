name: Release

# Build prebuilt binary tarballs (binaries + the static takeover UI) and attach
# them to a GitHub Release, so the stack runs without Nix. Push a semver tag to
# cut a release; run manually (workflow_dispatch) to build artifacts without
# publishing (the release step is skipped when not on a tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the static Astro takeover UI once and share it with every target —
  # the browser-session-takeover daemon serves it from TAKEOVER_WEBROOT.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: webroot
          path: frontend/dist
          if-no-files-found: error

  # One native runner per target — no cross-compilation, so aws-lc-rs (pulled by
  # reqwest's rustls) builds against the host toolchain with just cmake + cc.
  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # aws-lc-rs's build script drives cmake; the Linux images ship a C
      # toolchain but pin cmake explicitly so the build never depends on it
      # being preinstalled. (The macOS images already carry cmake + clang.)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --bins --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: webroot
          path: webroot

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          name="browser-session-${version}-${{ matrix.target }}"
          stage="staging/${name}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/browser-session" "${stage}/"
          cp -r webroot "${stage}/webroot"
          # systemd units + env example for running the daemons without Nix.
          cp -r packaging/systemd "${stage}/systemd"
          cp README.md LICENSE "${stage}/"
          tar -C staging -czf "${name}.tar.gz" "${name}"
          # macOS ships `shasum -a 256`, not GNU `sha256sum`; both emit the
          # same "<hash>  <file>" format the release job concatenates.
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error

  # Publish only for tag pushes; a workflow_dispatch run stops after building.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: cat ./*.sha256 > SHA256SUMS && rm -f ./*.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
