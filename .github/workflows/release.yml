name: Release

# Runs when the release PR from prepare-release.yml merges, publishing the version in Cargo.toml:
# a tarball per platform (the browser-session binary, the takeover UI and the systemd units) on a
# v<version> GitHub release with CHANGELOG.md's notes and a SHA256SUMS file.
# To retry one that failed part-way, re-run its failed jobs from the run's page.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.head_ref == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - id: version
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

  # Build the static Astro takeover UI once and share it with every target; the
  # browser-session-takeover daemon serves it from TAKEOVER_WEBROOT.
  frontend:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      # No dependency cache here: a release builds from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webroot
          path: frontend/dist
          if-no-files-found: error

  # Generate the portable systemd units from nixos-module.nix once (they're
  # platform-independent text) and ship them alongside the hand-written env +
  # README. Generating rather than committing keeps them from drifting from the
  # module NixOS users run.
  systemd:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}
      - uses: ./.github/actions/nix-cache
      - name: Assemble systemd dir
        run: |
          set -euo pipefail
          nix build -L .#systemd-units
          mkdir -p systemd
          cp result/*.service result/*.timer systemd/
          cp packaging/systemd/browser-session.env packaging/systemd/README.md systemd/
          chmod -R u+w systemd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemd
          path: systemd
          if-no-files-found: error

  # Build every target's release binary with Nix (`.#release` resolves to the
  # runner's own system). Linux: fully static musl, portable to any Linux, Nix
  # or not. macOS: a Nix build that links only the system's own libraries, so it
  # runs without Nix too (see packages.release in flake.nix).
  build:
    needs: [version, frontend, systemd]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}
      - uses: ./.github/actions/nix-cache

      - run: nix build -L .#release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webroot
          path: webroot

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: systemd
          path: systemd

      - name: Package tarball
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="browser-session-v${VERSION}-${TARGET}"
          stage="staging/${name}"
          mkdir -p "${stage}"
          install -m755 "$(readlink -f result)/bin/browser-session" "${stage}/browser-session"
          cp -r webroot "${stage}/webroot"
          # systemd units (generated from nixos-module.nix) + env example for
          # running the daemons without Nix.
          cp -r systemd "${stage}/systemd"
          cp README.md LICENSE "${stage}/"
          tar -C staging -czf "${name}.tar.gz" "${name}"
          # macOS ships `shasum -a 256`, not GNU `sha256sum`; both emit the
          # same "<hash>  <file>" format the release job concatenates.
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error

  # Tags v<version> and creates the GitHub release with CHANGELOG.md's notes and knope.toml's assets.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag and create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - name: Combine checksums
        working-directory: artifacts
        run: cat ./*.sha256 > SHA256SUMS && rm -f ./*.sha256
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release --verbose

  # Writes the Homebrew formula into xav-ie/homebrew-tap, so `brew install
  # xav-ie/tap/browser-session-mcp` gets this version. Skipped without the deploy key.
  tap:
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Update the Homebrew formula
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          version: ${{ needs.version.outputs.version }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "HOMEBREW_TAP_DEPLOY_KEY is missing; skipping the formula"; exit 0; }
          sha() { cut -d' ' -f1 "dist/browser-session-v$version-$1.tar.gz.sha256"; }
          key="$RUNNER_TEMP/tap-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:xav-ie/homebrew-tap.git tap
          mkdir -p tap/Formula
          cat > tap/Formula/browser-session-mcp.rb <<RUBY
          class BrowserSessionMcp < Formula
            desc "Isolated, long-lived Chrome sessions for AI agents over MCP"
            homepage "https://github.com/xav-ie/browser-session-mcp"
            license "MIT"

            on_macos do
              depends_on arch: :arm64
              depends_on macos: :sonoma

              on_arm do
                url "https://github.com/xav-ie/browser-session-mcp/releases/download/v$version/browser-session-v$version-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/xav-ie/browser-session-mcp/releases/download/v$version/browser-session-v$version-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
              on_arm do
                url "https://github.com/xav-ie/browser-session-mcp/releases/download/v$version/browser-session-v$version-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-musl)"
              end
            end

            def install
              libexec.install "browser-session", "webroot"
              # The takeover role serves the UI from TAKEOVER_WEBROOT; default it to the bundled one.
              (bin/"browser-session").write_env_script libexec/"browser-session",
                TAKEOVER_WEBROOT: "\${TAKEOVER_WEBROOT:-#{libexec}/webroot}"
              pkgshare.install "systemd"
            end

            test do
              assert_match "STATE_DIR is required", shell_output("#{bin}/browser-session mcp 2>&1", 1)
            end
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/browser-session-mcp.rb
          git commit -m "chore(browser-session-mcp): update to $version"
          git push
