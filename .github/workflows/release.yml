name: Release

# Build prebuilt binary tarballs (binaries + the static takeover UI) and attach
# them to a GitHub Release, so the stack runs without Nix. Push a semver tag to
# cut a release; run manually (workflow_dispatch) to build artifacts without
# publishing (the release step is skipped when not on a tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the static Astro takeover UI once and share it with every target —
  # the browser-session-takeover daemon serves it from TAKEOVER_WEBROOT.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: webroot
          path: frontend/dist
          if-no-files-found: error

  # Generate the portable systemd units from nixos-module.nix once (they're
  # platform-independent text) and ship them alongside the hand-written env +
  # README. Generating rather than committing keeps them from drifting from the
  # module NixOS users run.
  systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Assemble systemd dir
        run: |
          set -euo pipefail
          nix build -L .#systemd-units
          mkdir -p systemd
          cp result/*.service result/*.timer systemd/
          cp packaging/systemd/browser-session.env packaging/systemd/README.md systemd/
          chmod -R u+w systemd
      - uses: actions/upload-artifact@v4
        with:
          name: systemd
          path: systemd
          if-no-files-found: error

  # Build every target's release binary with Nix (`.#release` resolves to the
  # runner's own system). Linux → fully static musl, portable to any Linux, Nix
  # or not. macOS → an ordinary Nix build: macOS can't be statically linked, so
  # those binaries resolve libraries through /nix/store and only run where Nix is
  # installed (a NOTE-macos.txt in the tarball says so).
  build:
    needs: [frontend, systemd]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix build -L .#release

      - uses: actions/download-artifact@v4
        with:
          name: webroot
          path: webroot

      - uses: actions/download-artifact@v4
        with:
          name: systemd
          path: systemd

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          name="browser-session-${version}-${{ matrix.target }}"
          stage="staging/${name}"
          mkdir -p "${stage}"
          install -m755 "$(readlink -f result)/bin/browser-session" "${stage}/browser-session"
          cp -r webroot "${stage}/webroot"
          # systemd units (generated from nixos-module.nix) + env example for
          # running the daemons without Nix.
          cp -r systemd "${stage}/systemd"
          cp README.md LICENSE "${stage}/"
          # macOS binaries are Nix-built, not static — flag that they need Nix.
          case "${{ matrix.target }}" in
            *-apple-darwin)
              printf '%s\n' \
                'This macOS binary is built by Nix and is NOT statically linked' \
                '(macOS cannot be). Its libraries resolve through /nix/store, so it' \
                'only runs on a machine with Nix installed. Without Nix, build from' \
                'source (cargo build --release) or use the flake/NixOS module.' \
                > "${stage}/NOTE-macos.txt"
              ;;
          esac
          tar -C staging -czf "${name}.tar.gz" "${name}"
          # macOS ships `shasum -a 256`, not GNU `sha256sum`; both emit the
          # same "<hash>  <file>" format the release job concatenates.
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error

  # Publish only for tag pushes; a workflow_dispatch run stops after building.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: cat ./*.sha256 > SHA256SUMS && rm -f ./*.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
