name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend quality gates, one job per check so failures stay isolated.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [astro, lint, format]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:${{ matrix.check }}

  # Rust build (all binaries) + the frontend build + treefmt, reproducibly via
  # Nix. Deliberately builds the individual checks rather than `nix flake
  # check`, so the KVM-only VM test (checks.smoke) stays in its own job below
  # instead of failing here for lack of /dev/kvm.
  build-linux:
    name: build (x86-64 linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: |
          nix build -L \
            ".#checks.x86_64-linux.build" \
            ".#checks.x86_64-linux.treefmt"

  # NixOS VM integration test (checks.smoke): boots a VM running the real
  # nixos-module.nix stack and drives the full MCP surface. VM tests need
  # /dev/kvm, which GitHub's Linux runners expose but don't grant the runner
  # user access to by default — the udev rule below fixes that.
  nixos-test:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build -L ".#checks.x86_64-linux.smoke"

  # Compiles the binary on macOS (arm64 runner) with plain cargo — the same
  # path the prebuilt macOS release tarballs take — so a regression that only
  # breaks Apple targets is caught. This mirrors the *release* toolchain rather
  # than `nix build .#packages.aarch64-darwin.default`, which the flake now also
  # exposes but is not exercised here.
  build-darwin:
    name: build (aarch64-darwin)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bins
