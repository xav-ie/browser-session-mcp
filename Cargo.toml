[package]
name = "browser-session-mcp"
version = "0.1.14"
edition = "2021"
description = "MCP server giving each caller an isolated browser session against a shared persistent Chrome."
license = "MIT"

# One multi-call binary; the first argument selects the role
# (mcp | listener | reaper | takeover). See src/main.rs.
[[bin]]
name = "browser-session"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = [
  "server",
  "transport-io",
  # `mcp` over HTTP when MCP_HTTP_BIND is set (see src/mcp.rs).
  "transport-streamable-http-server",
] }
# The HTTP mode's listener: rmcp's service only handles requests, so hyper
# serves the connections and answers 404 off the /mcp path.
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
chromiumoxide = { version = "0.9", default-features = false }
futures = "0.3"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  # "net" + "io-util": the takeover daemon's tiny HTTP server (TcpListener +
  # AsyncRead/Write). All other binaries ignore them.
  "net",
  "io-util",
  "signal",
  "fs",
  "sync",
  "time",
] }
# Random takeover tokens.
getrandom = "0.4"
# Output schemas for tool results. The 1.x line rmcp's `server` feature already
# pulls in, so the derive shares its version.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TLS is required: production BROWSER_URL is https://chrome.<domain> behind
# Traefik (Chrome itself binds 127.0.0.1:9222, so the mcp-proxy container has
# no plaintext route to it). We need TLS for both reqwest (/json/version
# probe) and for async-tungstenite (the wss:// CDP upgrade) — the latter is
# pulled in transitively by chromiumoxide and we activate its TLS feature
# by adding it as a direct dep here.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
# The version MUST stay in sync with chromiumoxide's own async-tungstenite
# requirement (0.32): feature unification only applies within one version,
# so a newer major here silently leaves chromiumoxide's instance without
# TLS and every wss:// attach fails with "TLS support not compiled in".
async-tungstenite = { version = "0.32", default-features = false, features = [
  "tokio-runtime",
  "tokio-rustls-webpki-roots",
] }
url = "2"
base64 = "0.23"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
once_cell = "1"

# Minimal fork of chromiumoxide that does NOT send `Runtime.enable` (the primary
# CDP automation tell anti-bot systems detect) and empties the eval sourceURL.
# Evaluations run in an on-demand isolated world instead. The fork is a real
# GitHub fork of mattsse/chromiumoxide; the `no-runtime-enable` branch is one
# commit ahead of upstream `main` (a single patch to handler/frame.rs):
# https://github.com/xav-ie/chromiumoxide/tree/no-runtime-enable
[patch.crates-io]
chromiumoxide = { git = "https://github.com/xav-ie/chromiumoxide", rev = "c9b3bb8c1c99d10a9745bc7ad11a60f031de3fba" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# CI's check build on pull requests: the release profile without its slow
# whole-crate optimization, so a change compiles in a fraction of the time.
# Shipped binaries always use `release`.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
