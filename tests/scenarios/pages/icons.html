<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Message</title>
  <style>
    .actions button { width: 32px; height: 32px; margin: 4px; }
    .actions svg, .actions img { width: 16px; height: 16px; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #333; border-radius: 50%; }
    .fa-solid::before { content: "\f304"; }
  </style>
</head>
<body>
  <svg style="display: none"><symbol id="icon-archive" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/></symbol></svg>
  <p>Lunch on Friday? Let me know by Thursday.</p>
  <div class="actions" id="actions">
    <button><svg viewBox="0 0 16 16"><title>Delete</title><path d="M3 4h10M5 4v9h6V4"/></svg></button>
    <button><svg><use href="#icon-archive"></use></svg></button>
    <button><i class="fa-solid fa-pen"></i></button>
    <button data-testid="share-button"><span class="dot"></span></button>
    <button><img src="icons/close.svg"></button>
    <button><svg class="lucide lucide-star" viewBox="0 0 16 16"><path d="M8 1l2 5h5l-4 3 2 6-5-4-5 4 2-6-4-3h5z"/></svg></button>
    <button class="btn-ghost"><span class="dot"></span></button>
    <button aria-label="Reply"><svg class="lucide lucide-reply"></svg></button>
  </div>
  <script>
    window.clicked = [];
    document.querySelectorAll('#actions button').forEach(function (b, i) {
      b.addEventListener('click', function () { window.clicked.push(i); });
    });
  </script>
</body>
</html>
