<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign up</title>
  <style>.step { display: none; } .step.on { display: block; }</style>
</head>
<body>
  <div class="toolbar"><button id="run" type="button">Run ❯</button></div>
  <form id="signup">
    <div class="step on"><h2>Name</h2>
      <input id="first" placeholder="First name"> <input id="last" placeholder="Last name"></div>
    <div class="step"><h2>Contact</h2>
      <input id="email" type="email" placeholder="Email"></div>
    <div class="step"><h2>Review</h2><p>Check your details, then send them.</p></div>
    <button type="button" id="nextBtn">Next</button>
  </form>
  <footer><p>We use <a href="#" id="cookie-prefs">cookies</a> to run this site.</p></footer>
  <script>
    window.state = { sent: false, reset: false, prefs: false };
    var steps = document.querySelectorAll('.step'), at = 0, next = document.getElementById('nextBtn');
    var show = function () {
      steps.forEach(function (s, i) { s.classList.toggle('on', i === at); });
      next.textContent = at === steps.length - 1 ? 'Submit' : 'Next';
    };
    next.addEventListener('click', function () {
      if (at === steps.length - 1) { window.state.sent = true; return; }
      at++; show();
    });
    // Outside the form, like an editor's Run button around a demo: starts it over.
    document.getElementById('run').addEventListener('click', function () {
      window.state.reset = true; at = 0; document.getElementById('signup').reset(); show();
    });
    document.getElementById('cookie-prefs').addEventListener('click', function (e) { e.preventDefault(); window.state.prefs = true; });
  </script>
</body>
</html>
