<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 616" width="1062" height="616" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e7dcc0; }
  .bg { fill: #12081a; }
  .box { fill: #1b0e28; stroke: #3a2350; stroke-width: 2; }
  .key { fill: #fff17b; fill-opacity: .12; stroke: #fff17b; stroke-width: 2.5; }
  .end { fill: #c9b6e6; fill-opacity: .14; stroke: #c9b6e6; stroke-width: 2; }
  .note { fill: #2a2410; stroke: #7a6f2c; stroke-width: 1.5; }
  .frame { fill: #1b0e28; stroke: #3a2350; stroke-width: 1.5; }
  .group { fill: none; stroke: #9d8fb5; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #9d8fb5; }
  .label { font-size: 13px; font-weight: 550; fill: #c9b6e6; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .edge { fill: none; stroke: #c9b6e6; stroke-width: 2; marker-end: url(#arrow); }
  .both { marker-start: url(#arrow); }
  .ret { stroke-dasharray: 7 5; }
  .life { stroke: #3a2350; stroke-width: 2; stroke-dasharray: 4 5; }
  .tag { fill: #12081a; }
  .head { fill: #c9b6e6; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="616"/><rect class="group" x="24" y="150" width="1014" height="196" rx="16"/><text class="title" x="42" y="178">browser-session: one binary, four roles</text><text class="sub" x="42" y="330">They share one state dir: sessions, visit logs, saved cookies, takeover tickets.</text><rect class="box" x="24" y="420" width="1014" height="172" rx="14"/><text class="title" x="42" y="450">Chrome, with the DevTools Protocol on :9222</text><text class="sub" x="42" y="470">yours to run: headless or not, local or remote; one Chrome holds every session</text><rect class="box" x="24" y="24" width="360" height="72" rx="14"/><text class="title" x="204" y="56.1" text-anchor="middle">Your AI agent</text><text class="sub" x="204" y="75.2" text-anchor="middle">any MCP client, such as Claude Code</text><rect class="box" x="678" y="24" width="360" height="72" rx="14"/><text class="title" x="858" y="56.1" text-anchor="middle">A person</text><text class="sub" x="858" y="75.2" text-anchor="middle">only when a login needs them</text><rect class="key" x="40" y="194" width="233.5" height="104" rx="14"/><text class="title" x="156.8" y="233" text-anchor="middle">mcp</text><text class="sub" x="156.8" y="252.1" text-anchor="middle">the 31 tools, over stdio;</text><text class="sub" x="156.8" y="270.3" text-anchor="middle">restart it any time</text><rect class="key" x="289.5" y="194" width="233.5" height="104" rx="14"/><text class="title" x="406.3" y="233" text-anchor="middle">listener</text><text class="sub" x="406.3" y="252.1" text-anchor="middle">records console and network</text><text class="sub" x="406.3" y="270.3" text-anchor="middle">traffic, per visit</text><rect class="key" x="539" y="194" width="233.5" height="104" rx="14"/><text class="title" x="655.8" y="233" text-anchor="middle">reaper</text><text class="sub" x="655.8" y="252.1" text-anchor="middle">on a timer, closes sessions</text><text class="sub" x="655.8" y="270.3" text-anchor="middle">left idle</text><rect class="key" x="788.5" y="194" width="233.5" height="104" rx="14"/><text class="title" x="905.3" y="233" text-anchor="middle">takeover</text><text class="sub" x="905.3" y="252.1" text-anchor="middle">serves the page a person</text><text class="sub" x="905.3" y="270.3" text-anchor="middle">logs in through</text><rect class="frame" x="40" y="484" width="316.7" height="88" rx="14"/><text class="title" x="198.3" y="524.1" text-anchor="middle">Session a</text><text class="sub" x="198.3" y="543.2" text-anchor="middle">its own cookies, storage and tabs</text><rect class="frame" x="372.7" y="484" width="316.7" height="88" rx="14"/><text class="title" x="531" y="524.1" text-anchor="middle">Session b</text><text class="sub" x="531" y="543.2" text-anchor="middle">its own cookies, storage and tabs</text><rect class="frame" x="705.3" y="484" width="316.7" height="88" rx="14"/><text class="title" x="863.7" y="524.1" text-anchor="middle">Session c</text><text class="sub" x="863.7" y="543.2" text-anchor="middle">its own cookies, storage and tabs</text><path class="edge" d="M156.8 96L156.8 194"/><rect class="tag" x="38.4" y="114" width="236.6" height="19" rx="5"/><text class="label" x="156.8" y="128" text-anchor="middle">MCP tool calls, with a sessionId</text><path class="edge" d="M905.3 96L905.3 194"/><rect class="tag" x="818.5" y="114" width="173.5" height="19" rx="5"/><text class="label" x="905.3" y="128" text-anchor="middle">opens the takeover link</text><path class="edge" d="M156.8 298L156.8 420"/><path class="edge" d="M406.3 298L406.3 420"/><path class="edge" d="M655.8 298L655.8 420"/><path class="edge both" d="M905.3 298L905.3 420"/><rect class="tag" x="108.6" y="372" width="96.2" height="19" rx="5"/><text class="label" x="156.8" y="386" text-anchor="middle">drives pages</text><rect class="tag" x="340.6" y="372" width="131.3" height="19" rx="5"/><text class="label" x="406.3" y="386" text-anchor="middle">watches every tab</text><rect class="tag" x="618.2" y="372" width="75.2" height="19" rx="5"/><text class="label" x="655.8" y="386" text-anchor="middle">cleans up</text><rect class="tag" x="832.6" y="372" width="145.4" height="19" rx="5"/><text class="label" x="905.3" y="386" text-anchor="middle">live view and input</text></svg>
