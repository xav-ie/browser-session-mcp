<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 535" width="1062" height="535" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f1430; }
  .bg { fill: #f7f3fb; }
  .box { fill: #ffffff; stroke: #d9cde8; stroke-width: 2; }
  .key { fill: #7c4dbb; fill-opacity: .12; stroke: #7c4dbb; stroke-width: 2.5; }
  .end { fill: #5b3a86; fill-opacity: .14; stroke: #5b3a86; stroke-width: 2; }
  .note { fill: #fdf6c3; stroke: #c9b440; stroke-width: 1.5; }
  .frame { fill: #ffffff; stroke: #d9cde8; stroke-width: 1.5; }
  .group { fill: none; stroke: #5f5375; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #5f5375; }
  .label { font-size: 13px; font-weight: 550; fill: #5b3a86; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .edge { fill: none; stroke: #5b3a86; stroke-width: 2; marker-end: url(#arrow); }
  .both { marker-start: url(#arrow); }
  .ret { stroke-dasharray: 7 5; }
  .life { stroke: #d9cde8; stroke-width: 2; stroke-dasharray: 4 5; }
  .tag { fill: #f7f3fb; }
  .head { fill: #5b3a86; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="535"/><line class="life" x1="193" y1="96" x2="193" y2="511"/><line class="life" x1="531" y1="96" x2="531" y2="511"/><line class="life" x1="869" y1="96" x2="869" y2="511"/><rect class="box" x="32" y="24" width="322" height="72" rx="14"/><text class="title" x="193" y="65.2" text-anchor="middle">Your agent</text><rect class="key" x="370" y="24" width="322" height="72" rx="14"/><text class="title" x="531" y="65.2" text-anchor="middle">browser-session mcp</text><rect class="box" x="708" y="24" width="322" height="72" rx="14"/><text class="title" x="869" y="65.2" text-anchor="middle">Chrome</text><rect class="tag" x="278.8" y="113" width="166.4" height="19" rx="5"/><text class="label" x="362" y="127" text-anchor="middle">open_browser_session()</text><path class="edge" d="M193 135L531 135"/><rect class="tag" x="602.7" y="158" width="194.5" height="19" rx="5"/><text class="label" x="700" y="172" text-anchor="middle">create an isolated context</text><path class="edge" d="M531 180L869 180"/><rect class="tag" x="296.3" y="203" width="131.3" height="19" rx="5"/><text class="label" x="362" y="217" text-anchor="middle">sessionId: "a1b2"</text><path class="edge ret" d="M531 225L193 225"/><rect class="tag" x="257.7" y="248" width="208.6" height="19" rx="5"/><text class="label" x="362" y="262" text-anchor="middle">navigate(a1b2, …) and log in</text><path class="edge" d="M193 270L531 270"/><rect class="note" x="36" y="296" width="652" height="54" rx="8"/><text class="sub" x="362" y="318.3" text-anchor="middle">The MCP connection drops and the server process restarts. The context lives on in</text><text class="sub" x="362" y="336.5" text-anchor="middle">Chrome.</text><rect class="tag" x="289.3" y="369" width="145.4" height="19" rx="5"/><text class="label" x="362" y="383" text-anchor="middle">take_snapshot(a1b2)</text><path class="edge" d="M193 391L531 391"/><rect class="tag" x="613.3" y="414" width="173.5" height="19" rx="5"/><text class="label" x="700" y="428" text-anchor="middle">find context a1b2 again</text><path class="edge" d="M531 436L869 436"/><rect class="tag" x="264.7" y="459" width="194.5" height="19" rx="5"/><text class="label" x="362" y="473" text-anchor="middle">same tabs, still logged in</text><path class="edge ret" d="M531 481L193 481"/></svg>
